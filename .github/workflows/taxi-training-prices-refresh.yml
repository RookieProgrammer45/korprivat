name: Taxi training prices refresh

# Re-reads each school or authority price page every day. A page that cannot
# be read keeps its previous amount. A successful re-read merges, so the phone
# app and the desktop load the same prices.
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-read published taxi training prices
        run: python3 scripts/taxi-training/refresh.py --self-test && python3 scripts/taxi-training/refresh.py --write
      - name: Open pull request
        id: prices
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/taxi-training-prices-refresh
          delete-branch: true
          add-paths: data/taxi-training/published.json
          commit-message: 'data: daily taxi training price refresh'
          title: 'data: daily taxi training price refresh'
          body: |
            Prices re-read from each school or authority page.

            An amount changes only when that page shows a new number. A page that could not be read keeps the previous amount; those addresses are listed in `meta.unreadable`. A large drop is a failed read, not a school removing its price.
      - name: Publish the re-read
        if: steps.prices.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.prices.outputs.pull-request-number }} --squash --delete-branch
