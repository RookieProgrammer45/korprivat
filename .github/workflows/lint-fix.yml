name: Lint fix (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Auto-fix biome issues (format + organizeImports)
        run: npx biome check --write --max-diagnostics=200
      - name: List remaining errors (full)
        run: npx biome check --max-diagnostics=200 --diagnostic-level=error || true
      - name: Verify no errors remain
        run: npx biome check --max-diagnostics=200 --diagnostic-level=error
      - name: Commit fixes
        run: |
          git config user.name "drivelinkup-ci"
          git config user.email "noreply@drivelinkup.com"
          if git diff --quiet; then
            echo "Nothing to fix"
          else
            git add -A
            git commit -m "chore: biome check --write (format + organizeImports) - clear lint debt"
            git push
          fi
