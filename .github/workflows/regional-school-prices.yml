name: Regional school prices

# Re-reads lesson prices on each school's own website outside Sweden and opens
# a pull request. The OpenAI key is the repository secret, same as the Swedish
# price refresh. Nothing goes live until the pull request is merged.
on:
  workflow_dispatch:
  push:
    tags:
      - regional-prices-*

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stay on the main branch
        run: git switch -C main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Extract lesson prices
        run: npx tsx scripts/regional-schools/extract.ts --only europe-schools --fetch --extract --write
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Save the extracted file
        uses: actions/upload-artifact@v4
        with:
          name: europe-school-prices
          path: data/europe-schools/schools.json
          retention-days: 14
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/europe-schools/schools.json
          if git diff --cached --quiet; then
            echo "No price changes to publish"
            exit 0
          fi
          git commit -m "data: extract European school lesson prices"
          git push --force origin "HEAD:refs/heads/data/europe-school-prices"
          if gh pr view data/europe-school-prices --json url --jq .url; then
            echo "Updated the existing pull request"
          else
            gh pr create --base main --head data/europe-school-prices \
              --title "data: extract European school lesson prices" \
              --body "Lesson prices re-read from each school's own website. A null lesson price means the cited page did not state one lesson at that price. A from-price, a package total, and a rounded decimal are left empty."
          fi
